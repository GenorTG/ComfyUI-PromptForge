[project]
name = "ComfyUI-PromptForge"
description = "ComfyUI prompt enhancement suite: model/config node with GPU-aware auto settings, prompt enhancer with a preset catalog, and a standalone config finder."
version = "1.1.0"
license = { file = "LICENSE" }
dependencies = [
    "transformers",
    "torch",
    "huggingface-hub",
    "hf_xet",
    "psutil",
    "numpy",
    "Pillow",
    "bitsandbytes",
    "accelerate",
    "llama-cpp-python",
]

[project.urls]
Repository = "https://github.com/GenorTG/ComfyUI-PromptForge"

[tool.comfy]
PublisherId = "GenorTG"
DisplayName = "PromptForge: Unified Prompt Enhancer"
Icon = "https://raw.githubusercontent.com/GenorTG/ComfyUI-PromptForge/main/icon.png"
Banner = "https://raw.githubusercontent.com/GenorTG/ComfyUI-PromptForge/main/banner.png"
Category = "video"
